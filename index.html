<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-visual">
<meta name="theme-color" content="#111418">
<title>PCB Tracer</title>
<style>
:root{--bg:#111418;--panel:#1a1f26;--panel2:#262c35;--line:#343c48;--text:#e9edf2;--muted:#98a2ae;--accent:#4fb3ff;--ok:#3ecf72;--warn:#ffc53d;--bad:#ff5a5a;--front:#ff9a3d;--back:#4fb3ff;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;overflow:hidden;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-height:48px;min-width:48px;padding:0 14px;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:active{filter:brightness(1.25)}
button:disabled{opacity:.4}
button.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
button.danger{background:#3a1d20;border-color:#6b2a30;color:#ffb3b3}
button.on{background:#17344d;border-color:var(--accent);color:var(--accent)}
input[type=text]{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:48px;padding:0 12px;width:100%;-webkit-user-select:text;user-select:text}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:8px;padding:calc(6px + var(--st)) calc(8px + var(--sr)) 6px calc(8px + var(--sl));background:var(--panel);border-bottom:1px solid var(--line);min-height:56px}
header.top .title{flex:1;font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
header.top button{background:transparent;border-color:transparent}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip.front{color:var(--front)}.chip.back{color:var(--back)}
/* Projektliste */
#plist{flex:1;overflow:auto;padding:12px calc(12px + var(--sr)) 12px calc(12px + var(--sl));display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pitem{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer}
.pitem img,.pitem .noimg{width:72px;height:54px;object-fit:cover;border-radius:8px;background:var(--panel2);flex:none}
.pitem .meta{flex:1;min-width:0}
.pitem .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .sub{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;margin-top:20vh;padding:0 24px}
.listfoot{padding:10px calc(12px + var(--sr)) calc(10px + var(--sb)) calc(12px + var(--sl));background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.listfoot .info{color:var(--muted);font-size:12px;text-align:center}
.listfoot .info.warn{color:var(--warn)}
/* Sheets */
.sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:16px calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.sheet h2{margin:0;font-size:18px}
.sheet .row{display:flex;gap:8px}
.sheet .row>*{flex:1}
.filebtn{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;overflow:hidden;background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-height:56px;padding:8px 14px;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn .fn{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.progress{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .15s}
.ptext{color:var(--muted);font-size:13px;min-height:18px}
.err{color:var(--bad);font-size:14px}
.menu button{justify-content:flex-start;width:100%}
/* Projektansicht */
#proj{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr}
#stage{position:relative;overflow:hidden;touch-action:none;background:#0b0d10}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{pointer-events:none}
#ov{touch-action:none}
.bar{display:flex;flex-direction:column;gap:8px;padding:8px calc(8px + var(--sr)) calc(8px + var(--sb)) calc(8px + var(--sl));background:var(--panel);border-top:1px solid var(--line)}
.bar .row{display:flex;gap:8px;align-items:center}
.bar .row>button{flex:1;padding:0 8px}
.bar .status{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
.bar .status b{color:var(--text)}
input[type=range]{flex:1;accent-color:var(--accent);height:48px;margin:0}
#btnSide{flex:0 0 auto;min-width:96px}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(20,24,30,.92);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;max-width:90%;z-index:5;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
#toast.undo{pointer-events:auto}
#undoToast{position:fixed;left:50%;bottom:calc(90px + var(--sb));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;z-index:30}
@media (orientation:landscape) and (max-height:600px){
  #proj{grid-template-rows:auto 1fr;grid-template-columns:1fr auto}
  #proj>header{grid-column:1/3}
  #proj .bar{grid-row:2;grid-column:2;border-top:none;border-left:1px solid var(--line);width:min(40vw,300px);padding:8px calc(8px + var(--sr)) calc(8px + var(--sb)) 8px;justify-content:flex-end;overflow:auto}
  #proj .bar .row{flex-wrap:wrap}
  .sheetwrap{justify-content:flex-end}
  .sheet{max-width:min(420px,60vw);border-radius:18px 0 0 0;max-height:100%}
}
@media (min-width:900px){ .sheetwrap{align-items:center} .sheet{border-radius:18px;border-bottom:1px solid var(--line)} }
</style>
</head>
<body>

<section id="list" class="screen">
  <header class="top"><div class="title">PCB Tracer</div></header>
  <div id="plist"></div>
  <div class="listfoot">
    <button id="btnNew" class="primary">+ Neues Projekt</button>
    <div id="storeInfo" class="info"></div>
  </div>
</section>

<section id="proj" class="screen" hidden>
  <header class="top">
    <button id="btnBack" aria-label="Projektliste">‹</button>
    <div id="pname" class="title"></div>
    <span id="sideChip" class="chip"></span>
  </header>
  <div id="stage"><canvas id="gl"></canvas><canvas id="ov"></canvas><div id="toast"></div></div>
  <div id="barMain" class="bar">
    <div class="row">
      <button id="btnSide">Oben</button>
      <input id="fade" type="range" min="0" max="100" value="0" aria-label="Durchsicht">
      <button id="btnMenu" aria-label="Menü">⋯</button>
    </div>
  </div>
  <div id="barAlign" class="bar" hidden>
    <div id="aStatus" class="status"></div>
    <div id="aRowIdle" class="row">
      <button id="aFlipX" title="Rückseite links/rechts spiegeln">⇆</button>
      <button id="aFlipY" title="Rückseite oben/unten spiegeln">⇅</button>
      <button id="aRot" title="Rückseite drehen">⟳</button>
      <button id="aSuggest" title="Weitere Via-Paare automatisch suchen">✨ Vorschläge</button>
      <button id="aLink" class="on" title="Ansichten koppeln">🔗</button>
      <button id="aUndo" title="Rückgängig">↶</button>
      <button id="aDone" class="primary">Fertig</button>
    </div>
    <div id="aRowPending" class="row" hidden>
      <button id="aAccept" class="primary">✓ Paar übernehmen</button>
      <button id="aCancel">✕</button>
    </div>
    <div id="aRowProps" class="row" hidden>
      <button id="aAcceptAll" class="primary">✓ Alle übernehmen</button>
      <button id="aRejectAll">✕</button>
    </div>
    <div id="aRowSel" class="row" hidden>
      <button id="aDelete" class="danger">Paar löschen</button>
      <button id="aDeselect">✕</button>
    </div>
  </div>
</section>

<div id="sheetNew" class="sheetwrap" hidden>
  <div class="sheet">
    <h2>Neues Projekt</h2>
    <input id="newName" type="text" placeholder="Name der Platine" autocomplete="off">
    <label class="filebtn" id="lblFront" role="button"><span>📷 Oberseite wählen</span><span class="fn" id="fnFront"></span><input id="fileFront" type="file" accept="image/*"></label>
    <label class="filebtn" id="lblBack" role="button"><span>📷 Unterseite wählen</span><span class="fn" id="fnBack"></span><input id="fileBack" type="file" accept="image/*"></label>
    <div id="newProg" hidden><div class="progress"><div id="newBar"></div></div><div id="newPText" class="ptext"></div></div>
    <div id="newErr" class="err" hidden></div>
    <div class="row"><button id="newCancel">Abbrechen</button><button id="newGo" class="primary" disabled>Importieren</button></div>
  </div>
</div>

<div id="sheetMenu" class="sheetwrap" hidden>
  <div class="sheet menu">
    <button id="mAlign">⌖ Ausrichten</button>
    <button id="mList">‹ Projektliste</button>
    <button id="mClose">Schließen</button>
  </div>
</div>

<div id="sheetItem" class="sheetwrap" hidden>
  <div class="sheet menu">
    <h2 id="itemTitle"></h2>
    <button id="iOpen">Öffnen</button>
    <button id="iDelete" class="danger">Projekt löschen</button>
    <button id="iClose">Schließen</button>
  </div>
</div>

<div id="sheetConfirm" class="sheetwrap" hidden>
  <div class="sheet">
    <h2 id="confTitle"></h2>
    <div id="confText" style="color:var(--muted)"></div>
    <div class="row"><button id="confNo">Abbrechen</button><button id="confYes" class="danger">Löschen</button></div>
  </div>
</div>

<div id="undoToast" hidden><span id="undoText"></span><button id="undoBtn">Rückgängig</button></div>

<script>
'use strict';
// ---------------------------------------------------------------- gemeinsam (auch im Worker)
const TILE = 512, BORDER = 2;

function levelInfo(w, h) {
  let L = 0;
  while (Math.max(Math.ceil(w / 2 ** L), Math.ceil(h / 2 ** L)) > TILE) L++;
  return L;
}
function tileCount(w, h, l) {
  const s = 2 ** l;
  return [Math.ceil(Math.ceil(w / s) / TILE), Math.ceil(Math.ceil(h / s) / TILE)];
}
// Inhalt (c*) und Quelle inkl. Rand (s*) einer Kachel in Vollauflösungs-Pixeln, Texturgröße tw×th
function tileRect(w, h, l, tx, ty) {
  const s = 2 ** l, lw = Math.ceil(w / s), lh = Math.ceil(h / s);
  const x0 = tx * TILE, y0 = ty * TILE, x1 = Math.min(lw, x0 + TILE), y1 = Math.min(lh, y0 + TILE);
  const ex0 = Math.max(0, x0 - BORDER), ey0 = Math.max(0, y0 - BORDER);
  const ex1 = Math.min(lw, x1 + BORDER), ey1 = Math.min(lh, y1 + BORDER);
  return { cx0: x0 * s, cy0: y0 * s, cx1: Math.min(w, x1 * s), cy1: Math.min(h, y1 * s),
           sx0: ex0 * s, sy0: ey0 * s, sx1: Math.min(w, ex1 * s), sy1: Math.min(h, ey1 * s),
           tw: ex1 - ex0, th: ey1 - ey0 };
}
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('pcbtracer', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('projects', { keyPath: 'id' });
      d.createObjectStore('files');
      d.createObjectStore('tiles');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbGet(db, store, key) {
  return new Promise((res, rej) => {
    const r = db.transaction(store).objectStore(store).get(key);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbPutMany(db, store, entries) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite'), os = tx.objectStore(store);
    for (const [k, v] of entries) k === null ? os.put(v) : os.put(v, k);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('Speichern abgebrochen'));
  });
}

// Runde Fläche (Via/Lötauge), die sich farblich rundum vom Umfeld abhebt. C: RGB interleaved Uint8.
const BLOB_RADII = [4, 5.5, 7.5, 10, 13, 17, 22, 28, 36], BLOB_MIN = 22;
// Integralbilder je Farbkanal; score = kleinster Farbabstand Fläche ↔ einem der vier Randstreifen
function blobScorer(C, W, H) {
  const W1 = W + 1, N1 = W1 * (H + 1), I = [new Float64Array(N1), new Float64Array(N1), new Float64Array(N1)];
  for (let ch = 0; ch < 3; ch++) {
    const J = I[ch];
    for (let y = 0; y < H; y++) {
      let s = 0; const o = (y + 1) * W1, p = y * W1, q = y * W * 3 + ch;
      for (let x = 0; x < W; x++) { s += C[q + 3 * x]; J[o + x + 1] = J[p + x + 1] + s; }
    }
  }
  const mean = (x0, y0, x1, y1, out) => {
    const n = (x1 - x0) * (y1 - y0);
    for (let ch = 0; ch < 3; ch++) { const J = I[ch]; out[ch] = (J[y1 * W1 + x1] - J[y0 * W1 + x1] - J[y1 * W1 + x0] + J[y0 * W1 + x0]) / n; }
    return out;
  };
  const d = [0, 0, 0], t = [0, 0, 0], bo = [0, 0, 0], l = [0, 0, 0], r = [0, 0, 0];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const score = (x, y, a, b, c) => {
    mean(x - a, y - a, x + a + 1, y + a + 1, d);
    mean(x - c, y - c, x + c + 1, y - b, t); mean(x - c, y + b + 1, x + c + 1, y + c + 1, bo);
    mean(x - c, y - b, x - b, y + b + 1, l); mean(x + b + 1, y - b, x + c + 1, y + b + 1, r);
    return Math.min(dist(d, t), dist(d, bo), dist(d, l), dist(d, r));
  };
  return { mean, score };
}
function blobBoxes(rho) { const a = Math.max(1, Math.round(0.65 * rho)), b = Math.max(a + 1, Math.round(1.25 * rho)); return [a, b, Math.max(b + 2, Math.round(1.9 * rho))]; }
function detectBlob(C0, W, H, px, py, R) {
  const C = removeSpecks(C0, W, H);
  const { mean, score } = blobScorer(C, W, H);
  const R2 = R * R;
  let best = null;
  for (const rho of BLOB_RADII) {
    const [a, b, c] = blobBoxes(rho);
    const step = rho >= 10 ? 2 : 1;
    const xa = Math.max(c, Math.ceil(px - R)), xb = Math.min(W - c - 1, Math.floor(px + R));
    const ya = Math.max(c, Math.ceil(py - R)), yb = Math.min(H - c - 1, Math.floor(py + R));
    for (let y = ya; y <= yb; y += step) for (let x = xa; x <= xb; x += step) {
      const dx = x - px, dy = y - py, d2 = dx * dx + dy * dy;
      if (d2 > R2) continue;
      const sc = score(x, y, a, b, c), wt = sc * (1 - 0.5 * d2 / R2);
      if (!best || wt > best.wt) best = { x, y, rho, a, b, c, sc, wt };
    }
  }
  if (!best || best.sc < BLOB_MIN) return null;
  // Glanzpunkt o. ä. in einer größeren runden Fläche: die größere Fläche gewinnt
  let enc = null;
  for (const rho of BLOB_RADII) {
    if (rho <= best.rho * 1.3 || rho > best.rho * 4) continue;
    const [a, b, c] = blobBoxes(rho);
    const lim = 0.75 * rho, xa = Math.max(c, Math.ceil(best.x - lim)), xb = Math.min(W - c - 1, Math.floor(best.x + lim));
    const ya = Math.max(c, Math.ceil(best.y - lim)), yb = Math.min(H - c - 1, Math.floor(best.y + lim));
    for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) {
      if ((x - best.x) ** 2 + (y - best.y) ** 2 > lim * lim) continue;
      const sc = score(x, y, a, b, c);
      if (sc >= 0.35 * best.sc && sc >= BLOB_MIN && (!enc || sc > enc.sc)) enc = { x, y, rho, a, b, c, sc };
    }
  }
  if (enc) best = enc;
  for (let y = best.y - 1; y <= best.y + 1; y++) for (let x = best.x - 1; x <= best.x + 1; x++) {
    if (x < best.c || y < best.c || x > W - best.c - 1 || y > H - best.c - 1) continue;
    const sc = score(x, y, best.a, best.b, best.c);
    if (sc > best.sc) { best.sc = sc; best.x = x; best.y = y; }
  }
  // Farbachse Fläche→Umfeld, darauf Randpunkte suchen und Kreis anpassen
  const { x, y, a, b, c } = best;
  const dm = mean(x - a, y - a, x + a + 1, y + a + 1, [0, 0, 0]), bg = [0, 0, 0];
  for (const m of [mean(x - c, y - c, x + c + 1, y - b, [0, 0, 0]), mean(x - c, y + b + 1, x + c + 1, y + c + 1, [0, 0, 0]),
                   mean(x - c, y - b, x - b, y + b + 1, [0, 0, 0]), mean(x + b + 1, y - b, x + c + 1, y + b + 1, [0, 0, 0])])
    for (let ch = 0; ch < 3; ch++) bg[ch] += m[ch] / 4;
  const ax = [dm[0] - bg[0], dm[1] - bg[1], dm[2] - bg[2]], an = Math.hypot(...ax);
  const S = new Float32Array(W * H);
  for (let i = 0, j = 0; i < W * H; i++, j += 3) S[i] = (C[j] * ax[0] + C[j + 1] * ax[1] + C[j + 2] * ax[2]) / an;
  const fit = fitEdgeCircle(S, W, H, x, y, best.rho);
  return fit ? { x: fit.x, y: fit.y, r: fit.r, score: best.sc } : { x, y, r: best.rho, score: best.sc };
}
// Alle runden Flächen in einem Bildstück (Grobsuche, Schrittweite st); nur Bereich [ix0,ix1)×[iy0,iy1)
function scanBlobs(C, W, H, radii, minScore, ix0, iy0, ix1, iy1, st = 2) {
  const { score } = blobScorer(C, W, H), out = [];
  const gw = Math.ceil((ix1 - ix0) / st), gh = Math.ceil((iy1 - iy0) / st), S = new Float32Array(gw * gh), Rr = new Float32Array(gw * gh);
  for (const rho of radii) {
    const [a, b, c] = blobBoxes(rho);
    for (let gy = 0; gy < gh; gy++) {
      const y = iy0 + gy * st;
      if (y < c || y > H - c - 1) continue;
      for (let gx = 0; gx < gw; gx++) {
        const x = ix0 + gx * st;
        if (x < c || x > W - c - 1) continue;
        const sc = score(x, y, a, b, c), i = gy * gw + gx;
        if (sc > S[i]) { S[i] = sc; Rr[i] = rho; }
      }
    }
  }
  for (let gy = 1; gy < gh - 1; gy++) for (let gx = 1; gx < gw - 1; gx++) {
    const i = gy * gw + gx, v = S[i];
    if (v < minScore) continue;
    let mx = true;
    for (let dy = -2; dy <= 2 && mx; dy++) for (let dx = -2; dx <= 2; dx++) {
      if (!dx && !dy) continue;
      const yy = gy + dy, xx = gx + dx;
      if (yy < 0 || xx < 0 || yy >= gh || xx >= gw) continue;
      const u = S[yy * gw + xx];
      if (u > v || (u === v && (dy < 0 || (dy === 0 && dx < 0)))) { mx = false; break; }
    }
    if (mx) out.push([ix0 + gx * st, iy0 + gy * st, Rr[i], v]);
  }
  return out;
}
// Feinlage eines bekannten Kandidaten: nur Farbachse + Kreisrand, keine Suche
function refineVia(C, W, H, cx, cy, rho) {
  const [a, b, c] = blobBoxes(rho), dm = [0, 0, 0], bg = [0, 0, 0];
  let nd = 0, nbg = 0;
  for (let y = Math.max(0, Math.round(cy - c)); y <= Math.min(H - 1, Math.round(cy + c)); y++)
    for (let x = Math.max(0, Math.round(cx - c)); x <= Math.min(W - 1, Math.round(cx + c)); x++) {
      const ax = Math.abs(x - cx), ay = Math.abs(y - cy), i = (y * W + x) * 3;
      if (ax <= a && ay <= a) { dm[0] += C[i]; dm[1] += C[i + 1]; dm[2] += C[i + 2]; nd++; }
      else if (Math.max(ax, ay) > b) { bg[0] += C[i]; bg[1] += C[i + 1]; bg[2] += C[i + 2]; nbg++; }
    }

}

  }

async function loadTile(key, token) {
  const blob = await idbGet(S.db, 'tiles', key);

}

const meshCache = new Map();
const GRID = 8;

  const uv = (x, y) => [(x - r.sx0) / uw, (y - r.sy0) / vh];

function frontToPre(x, y) { const r = S.inv(x, y); return affApply(S.pre.m, r[0], r[1]); }
function preToFront(x, y) { const r = affApply(S.preInv, x, y); return S.fwd(r[0], r[1]); }
function linkFrom(id) {

  const a = S.cams[id], other = id === 'front' ? 'back' : 'front', b = S.cams[other];
  const map = id === 'front' ? frontToPre : preToFront;
  const p = map(a.cx, a.cy), q = map(a.cx + 50 / a.s, a.cy);
  const k = Math.hypot(q[0] - p[0], q[1] - p[1]) / (50 / a.s);

// ---------------------------------------------------------------- Ausrichtung
function rebuildAlign() {

  const B = p.align.pairs.map(q => q.b), F = p.align.pairs.map(q => q.f);
  S.fwd = fitMap(B, F, base, true);

    const m = fitMap(B.filter((_, j) => j !== i), F.filter((_, j) => j !== i), base), r = m(q.b[0], q.b[1]);

}
function pushUndo() { S.undo.push(JSON.stringify(S.proj.align)); if (S.undo.length > 100) S.undo.shift(); }

// ab 3 Paaren: Anzeige der Rückseite so drehen/spiegeln, dass sie wie die Vorderseite liegt
function autoOrient() {

  const A = affFit(pr.map(q => q.b), pr.map(q => q.f));

  const rate = pre => {
    const L = preMatrix(pre, bs.w, bs.h).m, Li = affInv(L), M = affMul(A, Li);
    return (M[0] + M[4]) / Math.sqrt(Math.abs(M[0] * M[4] - M[1] * M[3]));

const progWait = {};

// Pane-Koordinaten → Rohpunkt der Seite, gefangen auf Via falls sicher

}
const snapR = cam => clamp(28 / cam.s, 8, 60);

async function placePoint(paneId, wx, wy) {

  const pt = await snapPane(paneId, wx, wy, snapR(S.cams[paneId]));

    const pr = side === 'front' ? S.inv(pt.x, pt.y) : S.fwd(pt.x, pt.y);
    const cam = S.cams[other], disp = other === 'back' ? affApply(S.pre.m, pr[0], pr[1]) : pr;
    cam.cx = disp[0]; cam.cy = disp[1];

    P[other] = hit ? { x: hit.x, y: hit.y, r: hit.r, snapped: true } : { x: pr[0], y: pr[1], r: 0, snapped: false };

}
function commitPair() {

  const dup = pr.findIndex(q => Math.hypot(q.f[0] - P.front.x, q.f[1] - P.front.y) < 4);
  const pair = { f: [P.front.x, P.front.y], b: [P.back.x, P.back.y], rf: P.front.r, rb: P.back.r };

// Weitere Via-Paare vorschlagen: Vias beider Seiten über die aktuelle Zuordnung gegenseitig zuordnen
async function suggestPairs() {

  try {
    prog();
    const [af, ab] = await Promise.all([getVias('front', prog), getVias('back', prog)]);
    if (!af || !ab) { toast('Via-Suche fehlgeschlagen.'); return; }
    // Wie sieht ein Via auf dieser Platine aus? Vorbild sind die von Hand gesetzten Paare (je Seite)
    // (von Hand gesetzte zuerst, dazu übernommene Vorschläge; Messwerte werden am Paar gemerkt)

      if (!q.zb) { const h = await snapRaw('back', q.b[0], q.b[1], 8); if (h && h.z) { q.zb = Array.from(h.z); q.zrb = h.r; } }

    openProject(p);
  } catch (e) {
    $('#newErr').textContent = 'Import fehlgeschlagen: ' + e.message; $('#newErr').hidden = false;
    $('#newGo').disabled = !(nf.front && nf.back);
  }
};
async function importProject(name, fFront, fBack) {
  try { await navigator.storage?.persist?.(); } catch {}
  const est = await navigator.storage?.estimate?.();
  const need = (fFront.size + fBack.size) * 3;
  if (est && est.quota - est.usage < need) throw new Error(`zu wenig Speicher (frei ${((est.quota - est.usage) / 1048576).toFixed(0)} MB, nötig ca. ${(need / 1048576).toFixed(0)} MB)`);
  const pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  $('#newProg').hidden = false;
  const bar = $('#newBar'), txt = $('#newPText');
  try {
    await idbPutMany(S.db, 'files', [[pid + '|front', fFront], [pid + '|back', fBack]]);
    importWorker = new Worker(WORKER_URL);
    const sides = {};
    for (const [i, side] of ['front', 'back'].entries()) {
      txt.textContent = (side === 'front' ? 'Oberseite' : 'Unterseite') + ': Foto wird gelesen …';
      sides[side] = await new Promise((res, rej) => {
        importWorker.onmessage = e => {
          const m = e.data;
          if (m.type === 'progress') {
            bar.style.width = ((i + m.done / m.total) * 50).toFixed(1) + '%';
            txt.textContent = `${side === 'front' ? 'Oberseite' : 'Unterseite'}: ${m.done} / ${m.total} Kacheln`;
          } else if (m.type === 'imported') res({ w: m.w, h: m.h, L: m.L });
          else if (m.type === 'error') rej(new Error(m.message));
        };
        importWorker.onerror = e => rej(new Error(e.message || 'Worker-Fehler'));
        importWorker.postMessage({ type: 'import', pid, side, blob: side === 'front' ? fFront : fBack, thumb: side === 'front' });
      });
    }
    importWorker.terminate(); importWorker = null;
    const proj = { id: pid, name, created: Date.now(), updated: Date.now(), sides, align: { pre: { fx: true, fy: false, rot: 0 }, pairs: [] }, view: null };
    await idbPutMany(S.db, 'projects', [[null, proj]]);
    return proj;
  } catch (e) {
    if (importWorker) { importWorker.terminate(); importWorker = null; }
    await deleteProjectData(pid).catch(() => {});
    throw e;
  }
}

// Testhilfe (nur mit ?dev): Projekt aus URLs importieren
if (new URLSearchParams(location.search).has('dev')) window.__devImport = async (name, uf, ub) => {
  const [a, b] = await Promise.all([uf, ub].map(u => fetch(u).then(r => r.blob())));
  resetNew(); $('#sheetNew').hidden = false;
  const p = await importProject(name, new File([a], 'front.jpg', { type: a.type }), new File([b], 'back.jpg', { type: b.type }));
  $('#sheetNew').hidden = true; renderList(); openProject(p);
  return p.id;
};

  if (!gl) { document.body.innerHTML = '<p style="padding:24px">Dieser Browser unterstützt kein WebGL2.</p>'; return; }
  S.db = await openDB();
  await cleanupOrphans();

})();
